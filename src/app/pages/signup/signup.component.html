<app-default-login-layout
	title="Sign in and start today"
	primaryBtnText="Signup now"
	secondaryBtnText="Login now"
	(submit)="submit()"
	(navigate)="navigate()"
	[disablePrimaryBtn]="!signupForm.valid"
>
	<form [formGroup]="signupForm">
		<app-primary-input
			formControlName="name"
			type="text"
			inputName="name"
			label="Your Name"
			placeholder="John Doe"
		>
			<img src="/assets/svg/email-icon.svg" alt="">
		</app-primary-input>
		<app-primary-input
			formControlName="email"
			type="email"
			inputName="email"
			label="Email"
			placeholder="Email"
		>
			<img src="/assets/svg/email-icon.svg" alt="">
		</app-primary-input>
		<app-primary-input
			formControlName="password"
			type="password"
			inputName="password"
			label="Your Password"
			placeholder="Enter your password"
		>
			<img src="/assets/svg/password-icon.svg" alt="">
		</app-primary-input>
		<app-primary-input
			formControlName="passwordConfirm"
			type="password"
			inputName="passwordConfirm"
			label="Confirm your Password"
			placeholder="Confirm your Password"
		>
			<img src="/assets/svg/password-icon.svg" alt="">
		</app-primary-input>
	</form>

</app-default-login-layout>
